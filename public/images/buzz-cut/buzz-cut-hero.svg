<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E90FF"/>
      <stop offset="100%" style="stop-color:#38BDF8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#fff" stroke-width="1">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>
  <!-- Head silhouette -->
  <circle cx="600" cy="240" r="90" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.6"/>
  <ellipse cx="600" cy="350" rx="120" ry="60" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.3"/>
  <!-- Clipper icon -->
  <g transform="translate(520, 160)" opacity="0.4">
    <rect x="0" y="0" width="40" height="80" rx="8" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <line x1="10" y1="20" x2="30" y2="20" stroke="#38BDF8" stroke-width="2"/>
    <rect x="5" y="80" width="30" height="15" rx="2" fill="none" stroke="#38BDF8" stroke-width="2"/>
  </g>
  <!-- Text -->
  <text x="600" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" fill="#ffffff">BUZZ CUT GUIDE</text>
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#38BDF8">The Complete Men's Guide for 2026</text>
  <!-- Bottom accent line -->
  <rect x="450" y="530" width="300" height="4" rx="2" fill="url(#accent)" opacity="0.6"/>
  <!-- Badge -->
  <rect x="490" y="555" width="220" height="30" rx="15" fill="#FF4500" opacity="0.9"/>
  <text x="600" y="575" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="2">THE HONEST REVIEWERS</text>
</svg>
